; TokenBeacon display firmware for the LILYGO T-Display-S3 (ESP32-S3, ST7789 170x320).
; Toolchain and libraries are pinned (DEVICE design decision D-041/P-022): the
; board's display setup is verified with Arduino-ESP32 2.0.14 and TFT_eSPI 2.5.43.

[platformio]
default_envs = tdisplay_s3
boards_dir = boards

[common]
lib_deps =
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -std=gnu++17
    -DARDUINOJSON_USE_LONG_LONG=1
    -DARDUINOJSON_ENABLE_NAN=0
    -DARDUINOJSON_ENABLE_INFINITY=0
    -DTB_FW_VERSION=\"0.2.0\"

[env:tdisplay_s3]
platform = espressif32@6.5.0
board = tokenbeacon-tdisplay-s3
framework = arduino
lib_deps =
    ${common.lib_deps}
    bodmer/TFT_eSPI@2.5.43
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    ; USB: TinyUSB device mode with our own product name, so TokenBeacon can
    ; recognise the board before opening its port. Serial on boot is off: the
    ; USB descriptors are set in setup() first.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; TFT_eSPI configured here instead of editing the library (8-bit parallel ST7789).
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

; Host tests of the portable core with the shared protocol vectors.
[env:native]
platform = native@1.2.1
test_framework = unity
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DTB_VECTORS_DIR=\"${PROJECT_DIR}/../tests/device-vectors\"
