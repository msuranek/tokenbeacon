name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! TokenBeacon is local and read-only by design: it
        never changes Codex data, sends nothing over the network and has no
        telemetry. Ideas that need to break these rules are unlikely to be
        accepted, but feel free to start a discussion about the problem.

        Please don't paste your own Codex data (project names, thread titles,
        file paths or logs).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and what is hard or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How it could look or work. Mock-ups with made-up data are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
