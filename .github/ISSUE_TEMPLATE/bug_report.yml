name: Bug report
description: Something in TokenBeacon doesn't work or shows wrong numbers.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Please don't paste your own Codex data.** That includes project names,
        thread titles, file paths, database files, session logs and `auth.json`.
        Replace names with placeholders such as `project-a`. Screenshots are
        welcome only if nothing personal is visible.

        Security problems: please don't open a public issue. Follow
        [SECURITY.md](https://github.com/msuranek/tokenbeacon/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm start`
        2. Open http://127.0.0.1:4310
        3. ...
    validations:
      required: true
  - type: input
    id: tokenbeacon-version
    attributes:
      label: TokenBeacon version or commit
      description: The release (for example `0.1.0`) or the output of `git rev-parse --short HEAD`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example macOS 26.1 on Apple silicon.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: "v24.0.0"
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex version
      description: The version of the Codex app (shown in its About window), or the output of `codex --version` for the CLI.
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: Output of /api/health
      description: |
        Open http://127.0.0.1:4310/api/health (use your port if you changed it)
        and paste the result. It contains only status codes, never paths or
        conversation content.
      render: json
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Terminal output from `npm start`, screenshots without personal data, or other context. Please check it for names and paths first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed project names, thread titles, file paths and other personal data from this report.
          required: true
