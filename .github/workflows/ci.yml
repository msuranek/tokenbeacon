name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os == 'windows-latest' && 'Windows' || 'macOS' }} / Node ${{ matrix.node }}
    # macos-26 runs on Apple silicon; windows-latest is Windows Server.
    # Runners are free for public repositories.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
        # One Node.js LTS line per platform. package.json still supports
        # Node.js 22.18 or newer; other versions are not tested in CI.
        node: ["24"]

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Synthetic fixtures only; the runner has no Codex data.
        run: npm test

      - name: Build dashboard
        run: npm run build

      - name: Smoke test npm start (macOS)
        if: runner.os != 'Windows'
        # Starts the real server against an empty CODEX_HOME and checks that it
        # serves the dashboard and reports the missing data instead of crashing.
        env:
          CODEX_HOME: ${{ runner.temp }}/empty-codex-home
          TOKENBEACON_PORT: "4310"
        run: |
          mkdir -p "$CODEX_HOME"
          npm start > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4310/api/health > "$RUNNER_TEMP/health.json" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          cat "$RUNNER_TEMP/health.json"
          grep -q '"status":"degraded"' "$RUNNER_TEMP/health.json"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4310/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: attacker.example:4310' http://127.0.0.1:4310/api/snapshot)" = "421"
          kill "$server_pid" || true

      - name: Smoke test npm start (Windows, PowerShell)
        if: runner.os == 'Windows'
        # Same checks as on macOS, run the way a Windows user starts TokenBeacon.
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "empty-codex-home"
          $env:TOKENBEACON_PORT = "4310"
          New-Item -ItemType Directory -Force -Path $env:CODEX_HOME | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "server.log"
          $server = Start-Process -FilePath "npm.cmd" -ArgumentList "start" -NoNewWindow -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $health = $null
          for ($attempt = 0; $attempt -lt 60 -and -not $health; $attempt++) {
            try { $health = Invoke-RestMethod -Uri "http://127.0.0.1:4310/api/health" } catch { Start-Sleep -Seconds 1 }
          }
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
          try {
            if (-not $health) { throw "server did not answer /api/health" }
            $health | ConvertTo-Json -Depth 5
            if ($health.status -ne "degraded") { throw "expected status degraded, got $($health.status)" }
            $index = Invoke-WebRequest -Uri "http://127.0.0.1:4310/" -UseBasicParsing
            if ($index.StatusCode -ne 200) { throw "dashboard returned $($index.StatusCode)" }
            $foreign = & curl.exe -s -o NUL -w "%{http_code}" -H "Host: attacker.example:4310" "http://127.0.0.1:4310/api/snapshot"
            if ($foreign -ne "421") { throw "foreign Host returned $foreign, expected 421" }
          } finally {
            & taskkill.exe /PID $server.Id /T /F | Out-Null
          }
